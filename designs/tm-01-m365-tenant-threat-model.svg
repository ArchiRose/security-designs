</style><rect x="0" y="0" width="1000" height="300" fill="#FFFFFF"/><rect x="270" y="14" width="480" height="272" rx="4" class="zone"/><text x="280" y="30" class="zl">MICROSOFT 365 TENANT</text><rect x="20" y="60" width="200" height="60" rx="3" class="bx "/><text x="120.0" y="86.5" text-anchor="middle" class="t">Staff devices</text><text x="120.0" y="101.5" text-anchor="middle" class="s">laptops, phones, BYOD</text><rect x="20" y="190" width="200" height="60" rx="3" class="bx "/><text x="120.0" y="216.5" text-anchor="middle" class="t">Admins</text><text x="120.0" y="231.5" text-anchor="middle" class="s">Global admin, IT team</text><rect x="300" y="50" width="190" height="60" rx="3" class="bx "/><text x="395.0" y="76.5" text-anchor="middle" class="t">Entra ID</text><text x="395.0" y="91.5" text-anchor="middle" class="s">sign-in and tokens</text><rect x="300" y="190" width="190" height="60" rx="3" class="bx "/><text x="395.0" y="216.5" text-anchor="middle" class="t">Admin centres</text><text x="395.0" y="231.5" text-anchor="middle" class="s">roles and policies</text><rect x="530" y="50" width="190" height="60" rx="3" class="bx "/><text x="625.0" y="76.5" text-anchor="middle" class="t">Exchange Online</text><text x="625.0" y="91.5" text-anchor="middle" class="s">mailboxes</text><rect x="530" y="190" width="190" height="60" rx="3" class="bx "/><text x="625.0" y="216.5" text-anchor="middle" class="t">SharePoint, OneDrive</text><text x="625.0" y="231.5" text-anchor="middle" class="s">files and share links</text><rect x="800" y="50" width="180" height="60" rx="3" class="bx "/><text x="890.0" y="76.5" text-anchor="middle" class="t">Third-party apps</text><text x="890.0" y="91.5" text-anchor="middle" class="s">OAuth consent</text><rect x="800" y="190" width="180" height="60" rx="3" class="bx "/><text x="890.0" y="216.5" text-anchor="middle" class="t">External people</text><text x="890.0" y="231.5" text-anchor="middle" class="s">guests, share links</text><line x1="220" y1="88" x2="298" y2="82" class="ln" marker-end="url(#ah-tm1)"/><text x="259.0" y="76" text-anchor="middle" class="lb">sign in</text><line x1="220" y1="220" x2="298" y2="220" class="ln" marker-end="url(#ah-tm1)"/><text x="259.0" y="213" text-anchor="middle" class="lb">privileged</text><line x1="395" y1="190" x2="395" y2="112" class="ln" marker-end="url(#ah-tm1)"/><text x="403" y="156" text-anchor="start" class="lb">policies</text><line x1="490" y1="80" x2="528" y2="80" class="ln" marker-end="url(#ah-tm1)"/><text x="509.0" y="73" text-anchor="middle" class="lb">token</text><line x1="798" y1="80" x2="722" y2="80" class="ln" marker-end="url(#ah-tm1)"/><text x="760.0" y="73" text-anchor="middle" class="lb">API access</text><line x1="798" y1="220" x2="722" y2="220" class="ln" marker-end="url(#ah-tm1)"/><text x="760.0" y="213" text-anchor="middle" class="lb">share links</text></svg>
