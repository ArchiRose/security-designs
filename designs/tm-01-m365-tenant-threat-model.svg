<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" class="dg" viewBox="0 0 1000 300" role="img" aria-label="Data flow diagram of a Microsoft 365 tenant showing four flows crossing the tenant trust boundary: staff sign-in, admin access, third-party app API access and external sharing."><defs><marker id="ah-tm1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>
