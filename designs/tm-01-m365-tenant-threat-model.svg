.bx.warn{fill:#FBEFD9;stroke:#8F5400}
.bx.bad{fill:#F8E2E2;stroke:#A12C2C}
.zone{fill:none;stroke:#9AABB9;stroke-width:1.5;stroke-dasharray:6 5}
.ln{stroke:#5B6B78;stroke-width:1.5;fill:none}
.ah{fill:#5B6B78}
