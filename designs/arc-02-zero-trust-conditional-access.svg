<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" class="dg" viewBox="0 0 1000 360" role="img" aria-label="Conditional Access decision: sign-in signals plus device state from Intune and risk from Entra ID Protection lead to block, grant with MFA, or grant with phishing-resistant MFA for admins."><defs><marker id="ah-arc2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>
