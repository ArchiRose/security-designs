</style><rect x="0" y="0" width="1000" height="360" fill="#FFFFFF"/><rect x="20" y="135" width="170" height="90" rx="3" class="bx "/><text x="105.0" y="169.0" text-anchor="middle" class="t">Sign-in request</text><text x="105.0" y="184.0" text-anchor="middle" class="s">user, device,</text><text x="105.0" y="199.0" text-anchor="middle" class="s">location, app</text><line x1="190" y1="180" x2="248" y2="180" class="ln" marker-end="url(#ah-arc2)"/><text x="219.0" y="173" text-anchor="middle" class="lb">signals</text><rect x="250" y="20" width="180" height="56" rx="3" class="bx "/><text x="340.0" y="44.5" text-anchor="middle" class="t">Intune</text><text x="340.0" y="59.5" text-anchor="middle" class="s">device compliant?</text><line x1="340" y1="76" x2="340" y2="133" class="ln" marker-end="url(#ah-arc2)"/><text x="348" y="108" text-anchor="start" class="lb">device state</text><rect x="250" y="284" width="180" height="56" rx="3" class="bx "/><text x="340.0" y="308.5" text-anchor="middle" class="t">Entra ID Protection</text><text x="340.0" y="323.5" text-anchor="middle" class="s">sign-in and user risk</text><line x1="340" y1="284" x2="340" y2="227" class="ln" marker-end="url(#ah-arc2)"/><text x="348" y="260" text-anchor="start" class="lb">risk level</text><rect x="250" y="135" width="180" height="90" rx="3" class="bx hl"/><text x="340.0" y="169.0" text-anchor="middle" class="t">Conditional Access</text><text x="340.0" y="184.0" text-anchor="middle" class="s">all matching policies</text><text x="340.0" y="199.0" text-anchor="middle" class="s">must pass</text><rect x="500" y="20" width="220" height="70" rx="3" class="bx bad"/><text x="610.0" y="51.5" text-anchor="middle" class="t">Block</text><text x="610.0" y="66.5" text-anchor="middle" class="s">legacy auth or high risk</text><rect x="500" y="145" width="220" height="70" rx="3" class="bx warn"/><text x="610.0" y="176.5" text-anchor="middle" class="t">Grant with MFA</text><text x="610.0" y="191.5" text-anchor="middle" class="s">standard users</text><rect x="500" y="270" width="220" height="80" rx="3" class="bx good"/><text x="610.0" y="299.5" text-anchor="middle" class="t">Grant: phishing-resistant</text><text x="610.0" y="314.5" text-anchor="middle" class="s">MFA + compliant device</text><text x="610.0" y="328.5" text-anchor="middle" class="m">ADMIN ROLES</text><line x1="430" y1="160" x2="498" y2="62" class="ln" marker-end="url(#ah-arc2)"/><text x="474" y="122" text-anchor="start" class="lb">block rule</text><line x1="430" y1="180" x2="498" y2="180" class="ln" marker-end="url(#ah-arc2)"/><text x="464.0" y="173" text-anchor="middle" class="lb">user</text><line x1="430" y1="200" x2="498" y2="300" class="ln" marker-end="url(#ah-arc2)"/><text x="474" y="258" text-anchor="start" class="lb">admin</text><rect x="780" y="135" width="200" height="90" rx="3" class="bx good"/><text x="880.0" y="169.0" text-anchor="middle" class="t">Access granted</text><text x="880.0" y="184.0" text-anchor="middle" class="s">token for Microsoft 365,</text><text x="880.0" y="199.0" text-anchor="middle" class="s">Azure portal, SSO apps</text><line x1="720" y1="180" x2="778" y2="180" class="ln" marker-end="url(#ah-arc2)"/><text x="749.0" y="173" text-anchor="middle" class="lb">passes</text><line x1="720" y1="305" x2="778" y2="212" class="ln" marker-end="url(#ah-arc2)"/><text x="756" y="276" text-anchor="start" class="lb">passes</text></svg>
