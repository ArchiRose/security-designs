<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" class="dg" viewBox="0 0 1000 340" role="img" aria-label="Inbound email security: sender authentication, then Exchange Online Protection, then Defender for Office 365, with rejected, junk and quarantine outcomes and a user report path to the SOC."><defs><marker id="ah-arc4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>
