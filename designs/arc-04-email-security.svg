="middle" class="t">Rejected</text><text x="290.0" y="231.5" text-anchor="middle" class="s">DMARC fail, p=reject</text><line x1="290" y1="110" x2="290" y2="188" class="ln" marker-end="url(#ah-arc4)"/><text x="298" y="152" text-anchor="start" class="lb">fails</text><rect x="420" y="190" width="180" height="60" rx="3" class="bx warn"/><text x="510.0" y="216.5" text-anchor="middle" class="t">Junk or quarantine</text><text x="510.0" y="231.5" text-anchor="middle" class="s">spam, bulk, malware</text><line x1="510" y1="110" x2="510" y2="188" class="ln" marker-end="url(#ah-arc4)"/><text x="518" y="152" text-anchor="start" class="lb">filtered</text><rect x="640" y="190" width="200" height="60" rx="3" class="bx warn"/><text x="740.0" y="216.5" text-anchor="middle" class="t">Quarantine</text><text x="740.0" y="231.5" text-anchor="middle" class="s">malicious file or link</text><line x1="740" y1="110" x2="740" y2="188" class="ln" marker-end="url(#ah-arc4)"/><text x="748" y="152" text-anchor="start" class="lb">detonated</text><rect x="880" y="190" width="100" height="60" rx="3" class="bx "/><text x="930.0" y="216.5" text-anchor="middle" class="t">User reports</text><text x="930.0" y="231.5" text-anchor="middle" class="s">phish button</text><line x1="930" y1="110" x2="930" y2="188" class="ln" marker-end="url(#ah-arc4)"/><text x="922" y="152" text-anchor="end" class="lb">looks odd</text><rect x="860" y="280" width="120" height="50" rx="3" class="bx hl"/><text x="920.0" y="301.5" text-anchor="middle" class="t">SOC triage</text><text x="920.0" y="316.5" text-anchor="middle" class="s">see SOC-03</text><line x1="930" y1="250" x2="930" y2="278" class="ln" marker-end="url(#ah-arc4)"/></svg>
