<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" class="dg" viewBox="0 0 1000 346" role="img" aria-label="Network segmentation: internet traffic reaches only the DMZ on port 443; five internal VLANs talk to each other only through the default-deny firewall, which logs to Sentinel."><defs><marker id="ah-arc3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>
.bx{fill:#FFFFFF;stroke:#384956;stroke-width:1.5}
.bx.hl{stroke:#1D4E89;stroke-width:2.2}
.bx.good{fill:#E0F1E8;stroke:#1D6647}
.bx.warn{fill:#FBEFD9;stroke:#8F5400}
.bx.bad{fill:#F8E2E2;stroke:#A12C2C}
.zone{fill:none;stroke:#9AABB9;stroke-width:1.5;stroke-dasharray:6 5}
.ln{stroke:#5B6B78;stroke-width:1.5;fill:none}
.ah{fill:#5B6B78}
text{fill:#132029;font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:13px;font-weight:600}
.s{font-size:11.5px;fill:#384956}
.m,.lb,.zl{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:10.5px;fill:#5B6B78}
.m{font-size:10px}
.zl{letter-spacing:.08em}
</style><rect x="0" y="0" width="1000" height="346" fill="#FFFFFF"/><rect x="410" y="16" width="180" height="44" rx="3" class="bx "/><text x="500.0" y="42.0" text-anchor="middle" class="t">Internet</text><line x1="500" y1="60" x2="500" y2="108" class="ln" marker-end="url(#ah-arc3)"/><text x="510" y="90" text-anchor="start" class="lb">443 to DMZ only</text><rect x="380" y="110" width="240" height="56" rx="3" class="bx hl"/><text x="500.0" y="134.5" text-anchor="middle" class="t">Firewall</text><text x="500.0" y="149.5" text-anchor="middle" class="s">default deny, logs everything</text><rect x="700" y="110" width="280" height="56" rx="3" class="bx "/><text x="840.0" y="134.5" text-anchor="middle" class="t">DMZ</text><text x="840.0" y="149.5" text-anchor="middle" class="s">reverse proxy, web server</text><line x1="620" y1="138" x2="698" y2="138" class="ln" marker-end="url(#ah-arc3)"/><text x="659.0" y="131" text-anchor="middle" class="lb">443</text><rect x="20" y="110" width="280" height="56" rx="3" class="bx "/><text x="160.0" y="134.5" text-anchor="middle" class="t">Microsoft Sentinel</text><text x="160.0" y="149.5" text-anchor="middle" class="s">firewall logs (CEF)</text><line x1="380" y1="138" x2="302" y2="138" class="ln" marker-end="url(#ah-arc3)"/><text x="341.0" y="131" text-anchor="middle" class="lb">logs</text><line x1="500" y1="166" x2="500" y2="212" class="ln"/><line x1="108" y1="212" x2="892" y2="212" class="ln"/><text x="120" y="204" class="lb">every flow between VLANs crosses the firewall</text><line x1="108" y1="212" x2="108" y2="246" class="ln" marker-end="url(#ah-arc3)"/><rect x="20" y="248" width="176" height="62" rx="3" class="bx "/><text x="108.0" y="275.5" text-anchor="middle" class="t">Users</text><text x="108.0" y="290.5" text-anchor="middle" class="s">VLAN 10 · laptops</text><text x="108" y="332" text-anchor="middle" class="lb">servers, printers, web</text><line x1="304" y1="212" x2="304" y2="246" class="ln" marker-end="url(#ah-arc3)"/><rect x="216" y="248" width="176" height="62" rx="3" class="bx "/><text x="304.0" y="275.5" text-anchor="middle" class="t">Servers</text><text x="304.0" y="290.5" text-anchor="middle" class="s">VLAN 20 · files, apps</text><text x="304" y="332" text-anchor="middle" class="lb">updates only</text><line x1="500" y1="212" x2="500" y2="246" class="ln" marker-end="url(#ah-arc3)"/><rect x="412" y="248" width="176" height="62" rx="3" class="bx "/><text x="500.0" y="275.5" text-anchor="middle" class="t">Management</text><text x="500.0" y="290.5" text-anchor="middle" class="s">VLAN 99 · jump host</text><text x="500" y="332" text-anchor="middle" class="lb">admin from jump host</text><line x1="696" y1="212" x2="696" y2="246" class="ln" marker-end="url(#ah-arc3)"/><rect x="608" y="248" width="176" height="62" rx="3" class="bx "/><text x="696.0" y="275.5" text-anchor="middle" class="t">Guest Wi-Fi</text><text x="696.0" y="290.5" text-anchor="middle" class="s">VLAN 50 · visitors</text><text x="696" y="332" text-anchor="middle" class="lb">internet only</text><line x1="892" y1="212" x2="892" y2="246" class="ln" marker-end="url(#ah-arc3)"/><rect x="804" y="248" width="176" height="62" rx="3" class="bx "/><text x="892.0" y="275.5" text-anchor="middle" class="t">Printers, IoT</text><text x="892.0" y="290.5" text-anchor="middle" class="s">VLAN 60 · devices</text><text x="892" y="332" text-anchor="middle" class="lb">print server only</text></svg>
